<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/contato.css">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <title>Contato</title>
</head>

<body>
    <header>
        <div class="div-logo">
            <img class="logotipo" src="../img/logo.png" alt="Logotipo da Confeitaria Cassano Doces">
        </div>

        <div class="div-menu">
            <h1 class="titulo-header">CASSANO DOCES</h1>
            <nav>
                <ul>
                    <li>
                        <a href="../index.html">Início</a>
                    </li>
                    <li>
                        <a href="cardapio.html">Cardápio</a>
                    </li>
                    <li>
                        <a href="sobre.html">Sobre</a>
                    </li>
                    <li>
                        <a href="contato.html">Contato</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <h1 class="titulo-form">Formulário de Contato</h1>

    <form id="meuFormulario">
        <div class="container">
            <!-- Dados Pessoais -->
            <fieldset>
                <legend>Dados do Cliente</legend>

                <div class="item-form">
                    <label>Nome:</label>
                    <input type="text" required>
                </div>
            
                <div class="item-form">
                    <label>Endereço:</label>
                    <input type="text" required>
                </div>

                <div class="item-form">
                    <label>Telefone:</label>
                    <input type="tel" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Informações do Pedido</legend>

                <div class="item-form">
                    <label>Bolo:</label>
                    <select required>
                        <option disabled selected>--Selecione--</option>
                        <option>de Chocolate</option>
                        <option>de Fubá</option>
                        <option>de Cenoura</option>
                        <option>de Nutela</option>
                        <option>de Morango</option>
                        <option>de Ninho com Morango</option>
                    </select>
                </div>

                <div class="item-form">
                    <label>Quantidade:</label>
                    <input type="number" required min="1" max="100">
                </div>

                <div class="item-form">
                    <label>Total:</label>
                    <input type="number" required min="1" max="9999">
                </div>

                <div class="item-form">
                    <label>Forma de Pagamento:</label>
                    <select required>
                        <option disabled selected>--Selecione--</option>
                        <option>PIX</option>
                        <option>Cartão</option>
                        <option>Dinheiro</option>
                    </select>
                </div>

                <div class="item-form">
                    <label>Observações:</label>
                    <textarea rows="3" cols="25"></textarea>
                </div>
            </fieldset>
        </div>

        <div class="container botoes">
            <button type="submit" id="btnEnviar" disabled>Enviar Pedido</button>
            <button type="reset">Limpar Formulário</button>
        </div>
    </form>

    <footer>
        &copy; 2026 Cassano Doces.
        Todos os Direitos Reservados.
    </footer>
</body>
<script src="../js/contato.js"></script>
</html>
